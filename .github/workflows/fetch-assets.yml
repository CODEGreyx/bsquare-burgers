name: Fetch generated assets

on:
  push:
    branches:
      - "claude/**"
    paths:
      - "scripts/asset-urls.txt"
      - ".github/workflows/fetch-assets.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download assets listed in scripts/asset-urls.txt
        run: |
          set -euo pipefail
          sudo apt-get update -q && sudo apt-get install -y -q webp
          while IFS=' ' read -r dest url; do
            [ -z "$dest" ] && continue
            case "$dest" in \#*) continue ;; esac
            mkdir -p "$(dirname "$dest")"
            echo "Fetching $dest"
            curl -sSL --retry 3 -o "$dest" "$url"
            case "$dest" in
              *.png)
                cwebp -quiet -q 82 "$dest" -o "${dest%.png}.webp"
                rm "$dest"
                ;;
            esac
          done < scripts/asset-urls.txt

      - name: Commit assets
        run: |
          git config user.name "asset-fetch-bot"
          git config user.email "actions@github.com"
          git add -A public/assets
          git diff --cached --quiet || git commit -m "Add generated assets (Higgsfield downloads via CI)"
          git push
